[project]
name = "duckdb-fs"
version = "0.1.0"
description = "A read-only faceted FUSE filesystem over Great Expectations CSV results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pyfuse3>=3.5.0",
    "trio>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
duckdb-fs = "duckdb_fs.cli:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a visible /dev/fuse and performs a temporary mount",
]
